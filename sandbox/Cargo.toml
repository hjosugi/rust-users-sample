[package]
name = "sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shared = { version = "0.1.0", path = "../shared" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
